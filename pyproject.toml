[project]
name = "whiparound"
version = "0.1.0"
description = "whiparound: an auto-switching live sports channel for Dispatcharr (college football, NHL)"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "tzdata", "pillow>=10.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
tools = ["pillow>=10.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A leaked socket or file fails the suite (a leaked socket or file fails the suite).
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]
